# Unsigned Windows build for testing a branch on a real machine.
# Produces the NSIS installer as a workflow artifact (Actions tab -> run -> Artifacts).
# Not a release: no updater artifacts, no signing secrets needed.
name: Build Windows (test)

on:
  workflow_dispatch:
  push:
    branches: ["fix/**", "local/**"]

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: sherlock/desktop/src-tauri -> target

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sherlock/desktop/package-lock.json

      - name: Install frontend dependencies
        working-directory: sherlock/desktop
        run: npm ci

      - name: Download PDFium
        working-directory: sherlock/desktop/src-tauri
        shell: bash
        run: bash scripts/download-pdfium.sh

      - name: Download ONNX Runtime
        working-directory: sherlock/desktop/src-tauri
        shell: bash
        run: bash scripts/download-onnxruntime.sh

      # createUpdaterArtifacts=false: the updater signing key only exists in the
      # upstream repo's secrets, and a test build doesn't need updater bundles.
      - name: Build installer (NSIS)
        working-directory: sherlock/desktop
        shell: bash
        run: npm run tauri -- build --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: frank-sherlock-windows-${{ github.sha }}
          path: sherlock/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
